name: Launcher ZarkTV (tela inicial)

# Compila só a tela inicial ZarkTV (pasta launcher/), separada dos apps ZarkTV.
# Link fixo do APK:
#   https://github.com/nilsonlopes2298-web/zarktv-app/releases/download/launcher/zarktv-launcher.apk
on:
  push:
    branches: [launcher]
    paths:
      - 'launcher/**'
      - '.github/workflows/launcher.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
      SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Chave de assinatura
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Compilar launcher
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon -p launcher assembleRelease \
            -PappVersionName="1.${{ github.run_number }}.0" -PappVersionCode="${{ github.run_number }}"
          cp "$(find launcher/build/outputs/apk/release -name '*.apk' | head -1)" zarktv-launcher.apk

      - name: Publicar
        uses: softprops/action-gh-release@v2
        with:
          tag_name: launcher
          target_commitish: ${{ github.sha }}
          name: Launcher ZarkTV (tela inicial)
          prerelease: true
          files: zarktv-launcher.apk
          body: |
            Tela inicial ZarkTV para Android TV / Google TV / TV Box.
            Apps instalados com status, favoritos, relógio, internet, armazenamento, memória
            e o painel "Minha Roxinha" (sistemas da VPS no ar ou fora do ar).
