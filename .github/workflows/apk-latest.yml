name: APK latest (ZarkTV)

# A cada envio pra main: compila o APK, assina com a chave permanente (se os segredos
# existirem) e publica na versao "latest", com link fixo:
#   https://github.com/nilsonlopes2298-web/zarktv-app/releases/download/latest/zarktv.apk
# Junto vai o version.json que o app le ao abrir: se a versao for mais nova, o app
# obriga a atualizar.

# Ramo "beta": publica na versão "beta" (só quem ligou "versões de teste" no app recebe).
# Ramo "main": publica na versão "latest" (todos os clientes).
on:
  push:
    branches: [main, beta, mobile-ui]
    paths-ignore:
      - 'painel-checkout/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
      SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Chave de assinatura
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Assinando com a chave permanente do ZarkTV."
          else
            echo "::warning::Segredos de assinatura nao configurados: o APK sai com chave de teste e a atualizacao automatica NAO instala por cima. Configure SIGNING_KEYSTORE_BASE64, SIGNING_STORE_PASSWORD, SIGNING_KEY_ALIAS e SIGNING_KEY_PASSWORD."
          fi

      - name: Versao
        run: |
          echo "VERSAO=1.${{ github.run_number }}.0" >> "$GITHUB_ENV"
          if [ "${{ github.ref_name }}" = "beta" ]; then echo "TAG=beta" >> "$GITHUB_ENV"; elif [ "${{ github.ref_name }}" = "mobile-ui" ]; then echo "TAG=mobile" >> "$GITHUB_ENV"; else echo "TAG=latest" >> "$GITHUB_ENV"; fi

      - name: Compilar APK
        # main: só o app dos clientes (unico). beta: o app dos clientes + ZarkTV TV + ZarkTV Mobile.
        run: |
          if [ "$TAG" = "mobile" ]; then
            ./gradlew --no-daemon assembleMobileRelease assembleTvRelease assembleZarkplayRelease -PappVersionName="$VERSAO"
          elif [ "$TAG" = "beta" ]; then
            ./gradlew --no-daemon assembleUnicoRelease assembleTvRelease assembleMobileRelease assembleZarkplayRelease -PappVersionName="$VERSAO"
          else
            # Produção: os três apps (atual, ZarkTV TV e ZarkTV Mobile) pedem atualização pela versão "latest".
            ./gradlew --no-daemon assembleUnicoRelease assembleTvRelease assembleMobileRelease assembleZarkplayRelease -PappVersionName="$VERSAO"
          fi

      - name: Renomear e gerar version.json
        run: |
          NOTAS=$(git log -1 --pretty=%s | sed 's/"/\\"/g')
          publicar() { # $1 = versão do app (unico/tv/mobile), $2 = nome do APK, $3 = nome do json
            APK=$(find "app/build/outputs/apk/$1/release" -name '*.apk' | head -1)
            [ -n "$APK" ] || return 0
            echo "APK $1: $APK -> $2"
            cp "$APK" "$2"
            cat > "$3" <<JSON
          {
            "version": "$VERSAO",
            "url": "https://github.com/nilsonlopes2298-web/zarktv-app/releases/download/$TAG/$2",
            "obrigatoria": false,
            "tamanho": $(stat -c %s "$2"),
            "notas": "$NOTAS"
          }
          JSON
            cat "$3"
          }
          publicar unico zarktv.apk version.json
          publicar tv zarktv-tv.apk version-tv.json
          publicar mobile zarktv-mobile.apk version-mobile.json
          publicar zarkplay zarkplay.apk version-zarkplay.json

      - name: Publicar (latest ou beta)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: ${{ env.TAG == 'beta' && 'ZarkTV (versao de teste)' || 'ZarkTV (versao atual)' }}
          prerelease: true
          files: |
            zarktv*.apk
            zarkplay.apk
            version*.json
          body: |
            APK do ZarkTV (base Channelbox, GPLv3).
            zarktv.apk = app atual (celular + TV). Na versão de teste também saem:
            zarktv-tv.apk (ZarkTV TV: TV Box, Android TV, Fire Stick) e zarktv-mobile.apk (ZarkTV Mobile: celular e tablet).
            zarkplay.apk = ZarkPlay (estilo XCIPTV, celular e TV, mesmo painel).
            Link fixo sempre atualizado:
            https://github.com/nilsonlopes2298-web/zarktv-app/releases/download/latest/zarktv.apk
